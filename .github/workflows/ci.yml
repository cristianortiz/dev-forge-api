name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate API contract
        run: make openapi-check

      - name: Test
        run: make test

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/server
